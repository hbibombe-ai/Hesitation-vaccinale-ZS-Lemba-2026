<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Illustration : un parent hésite entre OUI et NON face à la vaccination de son enfant, pendant qu'un agent de santé lui tend une seringue">
  <defs>
    <linearGradient id="bgLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdece0"/>
      <stop offset="1" stop-color="#fbdcc6"/>
    </linearGradient>
    <linearGradient id="bgRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcedfb"/>
      <stop offset="1" stop-color="#c7e2f8"/>
    </linearGradient>
    <linearGradient id="syringeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9fa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b0b0b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===================== FOND SCINDÉ : doute (gauche, chaud) / confiance (droite, froid) ===================== -->
  <rect x="0" y="0" width="1200" height="420" rx="28" fill="#fbdcc6"/>
  <path d="M0 0 H640 L560 420 H0 Z" fill="url(#bgLeft)"/>
  <path d="M640 0 H1200 V420 H560 Z" fill="url(#bgRight)"/>
  <circle cx="90" cy="70" r="90" fill="#ec835a" opacity="0.10"/>
  <circle cx="1140" cy="360" r="130" fill="#2a78d6" opacity="0.10"/>

  <!-- gros points d'interrogation décoratifs, flottants -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" fill="#d98a52" opacity="0.5">
    <text x="60" y="190" font-size="46" transform="rotate(-10 60 190)">?</text>
    <text x="150" y="330" font-size="30" transform="rotate(8 150 330)">?</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" fill="#4f93e0" opacity="0.5">
    <text x="1110" y="150" font-size="40" transform="rotate(9 1110 150)">?</text>
    <text x="1030" y="60" font-size="26" transform="rotate(-6 1030 60)">?</text>
  </g>

  <!-- ===================== MOTS OUI / NON, grand format, en arrière-plan ===================== -->
  <text x="40" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="74" font-weight="900"
        fill="#c75a2e" opacity="0.22" letter-spacing="2">NON&#160;?</text>
  <text x="870" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="74" font-weight="900"
        fill="#1c5cab" opacity="0.22" letter-spacing="2">OUI&#160;?</text>

  <!-- sol -->
  <rect x="60" y="372" width="1080" height="10" rx="5" fill="#8a8678" opacity="0.28"/>

  <!-- ===================== PARENT + BÉBÉ (gauche, zone du doute) ===================== -->
  <g filter="url(#soft)">
    <!-- tabouret -->
    <rect x="150" y="338" width="150" height="16" rx="8" fill="#c3a98e" opacity="0.55"/>
    <rect x="180" y="354" width="16" height="22" fill="#c3a98e" opacity="0.55"/>
    <rect x="254" y="354" width="16" height="22" fill="#c3a98e" opacity="0.55"/>

    <!-- corps du parent -->
    <path d="M165 370 C160 265 182 212 258 212 C336 212 356 265 351 370 Z" fill="#ec835a"/>
    <path d="M226 222 Q258 243 290 222 L290 212 Q258 228 226 212 Z" fill="#c75a2e"/>

    <!-- bras gauche, enveloppant l'enfant -->
    <path d="M192 252 Q150 280 176 328" stroke="#ec835a" stroke-width="28" fill="none" stroke-linecap="round"/>

    <!-- bras droit : geste hésitant, paume levée, bien visible -->
    <path d="M310 246 Q368 222 362 168" stroke="#ec835a" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="364" cy="156" r="19" fill="#f0c9a0"/>
    <path d="M349 142 l-5 -15 M362 138 l0 -16 M375 141 l5 -15" stroke="#f0c9a0" stroke-width="6" stroke-linecap="round"/>

    <!-- tête du parent -->
    <circle cx="258" cy="168" r="50" fill="#f0c9a0"/>
    <path d="M209 161 Q212 110 258 108 Q304 110 307 161 Q304 133 258 131 Q212 133 209 161 Z" fill="#3a2a1a"/>
    <path d="M234 162 q11 -9 22 -2 M260 160 q11 -7 22 2" stroke="#3a2a1a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="243" cy="173" r="4.5" fill="#3a2a1a"/>
    <circle cx="275" cy="173" r="4.5" fill="#3a2a1a"/>
    <path d="M242 199 q16 -6 32 0" stroke="#8a5a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- bulle de doute au-dessus de la tête -->
    <circle cx="320" cy="92" r="24" fill="#ffffff" stroke="#d98a52" stroke-width="2.5"/>
    <text x="320" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#c75a2e" text-anchor="middle">?</text>

    <!-- bébé sur les genoux, tourné à l'opposé de la seringue -->
    <ellipse cx="305" cy="312" rx="60" ry="50" fill="#ffffff"/>
    <ellipse cx="305" cy="312" rx="60" ry="50" fill="#ec835a" opacity="0.08"/>
    <circle cx="280" cy="260" r="35" fill="#f6d7b0"/>
    <path d="M262 236 q18 -15 36 0" stroke="#3a2a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M266 258 q8 -6 16 -1 M284 256 q8 -5 16 1" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="272" cy="266" r="3" fill="#3a2a1a"/>
    <circle cx="290" cy="265" r="3" fill="#3a2a1a"/>
    <path d="M271 278 q9 -5 18 0" stroke="#b6552f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M250 291 Q214 281 209 260" stroke="#f6d7b0" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="208" cy="255" r="10" fill="#f6d7b0"/>
  </g>

  <!-- ===================== LIGNE D'HÉSITATION, décision suspendue ===================== -->
  <path d="M390 170 Q540 115 660 160" stroke="#8a8678" stroke-width="2.5" fill="none" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>

  <!-- flacon de vaccin, au centre, posé sur une petite étagère -->
  <g filter="url(#soft)" transform="translate(556,210)">
    <rect x="-6" y="92" width="92" height="10" rx="4" fill="#c3a98e" opacity="0.5"/>
    <rect x="6" y="18" width="56" height="72" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/>
    <rect x="6" y="18" width="56" height="30" rx="10" fill="#cde2fb"/>
    <rect x="20" y="0" width="28" height="22" rx="4" fill="#2a78d6"/>
    <rect x="16" y="-8" width="36" height="10" rx="3" fill="#1c5cab"/>
    <text x="34" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#1c5cab" text-anchor="middle">VACCIN</text>
    <rect x="16" y="76" width="36" height="3" fill="#9ec5f4"/>
  </g>

  <!-- ===================== AGENT DE SANTÉ (droite, zone de la confiance) ===================== -->
  <g filter="url(#soft)">
    <!-- corps / blouse -->
    <path d="M790 372 C786 272 808 216 884 216 C960 216 982 272 978 372 Z" fill="#ffffff" stroke="#c3c2b7" stroke-width="2"/>
    <path d="M852 226 Q884 246 916 226 L916 216 Q884 231 852 216 Z" fill="#2a78d6"/>
    <rect x="875" y="270" width="18" height="48" rx="4" fill="#2a78d6"/>
    <rect x="861" y="285" width="46" height="18" rx="4" fill="#2a78d6"/>

    <!-- tête -->
    <circle cx="884" cy="176" r="50" fill="#e3b183"/>
    <path d="M834 170 Q836 124 884 120 Q932 124 934 170 Q932 140 884 138 Q836 140 834 170 Z" fill="#ffffff" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="871" y="122" width="26" height="11" rx="3" fill="#2a78d6"/>
    <path d="M862 176 q11 -7 20 0 M890 176 q11 -7 20 0" stroke="#5a3a20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="870" cy="187" r="4.5" fill="#3a2a1a"/>
    <circle cx="900" cy="187" r="4.5" fill="#3a2a1a"/>
    <path d="M868 207 q17 13 34 0" stroke="#8a4a2a" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- bras tendu tenant la seringue, geste assuré et bienveillant -->
    <path d="M834 258 Q738 228 684 204" stroke="#2a78d6" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="680" cy="202" r="16" fill="#e3b183"/>

    <!-- seringue, grande et nette, pointant vers le bébé -->
    <g transform="translate(560,150) rotate(16)">
      <rect x="-16" y="12" width="18" height="12" fill="#898781"/>
      <path d="M-16 18 L-40 18" stroke="#898781" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="2" y="2" width="82" height="24" rx="5" fill="url(#syringeBody)" stroke="#5598e7" stroke-width="2.5"/>
      <rect x="12" y="6" width="54" height="16" fill="#9ec5f4"/>
      <line x1="24" y1="2" x2="24" y2="26" stroke="#5598e7" stroke-width="1.5"/>
      <line x1="38" y1="2" x2="38" y2="26" stroke="#5598e7" stroke-width="1.5"/>
      <line x1="52" y1="2" x2="52" y2="26" stroke="#5598e7" stroke-width="1.5"/>
      <rect x="66" y="-9" width="12" height="38" rx="2" fill="#898781"/>
    </g>
  </g>

  <!-- ===================== BANDEAU DE TITRE, en bas, pour l'ancrage du propos ===================== -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="408" font-size="17" font-weight="700" fill="#52514e">Entre doute des parents et confiance envers la vaccination — ce que mesure cette enquête</text>
  </g>
</svg>
